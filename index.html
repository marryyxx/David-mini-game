<!DOCTYPE html>
<html>
<head>
  <title>David's Cursed Doors</title>

  <style>
    body {
      background-color: black;
      color: white;
      text-align: center;
      font-family: 'Courier New', monospace;
      margin-top: 80px;
      overflow: hidden;
    }

    h1 {
      font-size: 40px;
    }

    .door {
      font-size: 90px;
      cursor: pointer;
      margin: 20px;
      transition: transform 0.2s;
      position: relative;
    }

    .door:hover {
      transform: scale(1.2);
    }

    #fakeDoor {
      position: absolute;
    }

    #message {
      margin-top: 40px;
      font-size: 28px;
    }

    .jumpscare {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: red;
      color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      animation: shake 0.2s infinite;
    }

    @keyframes shake {
      0% { transform: translate(0px, 0px); }
      25% { transform: translate(15px, -15px); }
      50% { transform: translate(-15px, 15px); }
      75% { transform: translate(15px, 15px); }
      100% { transform: translate(-15px, -15px); }
    }
  </style>
</head>

<body>

<h1>🎮 David's Brainrot Doors 🎮</h1>
<p>One door = Birthday. One door = CURSED. One door = TROLL.</p>

<div id="doors">
  <span class="door" onclick="chooseDoor(1)">🚪</span>
  <span class="door" onclick="chooseDoor(2)">🚪</span>
  <span class="door" onclick="chooseDoor(3)">🚪</span>
  <span class="door" id="fakeDoor">🚪</span>
</div>

<div id="message"></div>

<script>

  const correctDoor = Math.floor(Math.random() * 3) + 1;
  const fakeDoor = document.getElementById("fakeDoor");

  // Fake door runs away
  fakeDoor.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 100);

    fakeDoor.style.left = x + "px";
    fakeDoor.style.top = y + "px";
  });

  fakeDoor.addEventListener("click", () => {
    alert("BRO REALLY THOUGHT THIS WAS REAL 💀");
    fakeDoor.style.display = "none";
  });

  function chooseDoor(doorNumber) {

    if (doorNumber === correctDoor) {

      document.body.style.background = "linear-gradient(green, lime)";
      document.body.innerHTML = `
        <h1>🎉 HAPPY BIRTHDAY DAVID!!! 🎉</h1>
        <h2>You defeated the Brainrot Entity 😎🔥</h2>
        <p>+9999 Minecraft XP</p>
        <p>Roblox Legend Status: UNLOCKED 👑</p>
      `;

    } else {

      const scare = document.createElement("div");
      scare.classList.add("jumpscare");
      scare.innerHTML = "SKIBIDI CURSE ACTIVATED 😱";
      document.body.appendChild(scare);

      setTimeout(() => {
        alert("You chose the wrong door... try again 😈");
        location.reload();
      }, 1000);
    }
  }

</script>

</body>
</html>
